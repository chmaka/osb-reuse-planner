name: Build & Geometry Tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Save analytics UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osb-analytics-ui-preview
          path: test-results/analytics-*.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Save browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-report
          path: test-results/
          if-no-files-found: ignore
          retention-days: 3
